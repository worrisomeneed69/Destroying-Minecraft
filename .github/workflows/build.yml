name: Build + server smoke test

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon > build.log 2>&1 || true
          tail -30 build.log
          ls -la build/libs/

      - name: Server smoke test
        run: |
          mkdir -p servertest/mods
          cd servertest
          echo "eula=true" > eula.txt
          curl -sL --retry 3 -o fabric-server.jar "https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.18.4/1.1.2/server/jar"
          curl -sL --retry 3 -o mods/fabric-api.jar "https://cdn.modrinth.com/data/P7dR8mSH/versions/Nlt8gI9z/fabric-api-0.116.15%2B1.21.1.jar"
          cp ../build/libs/*.jar mods/ 2>/dev/null || true
          timeout 240 java -jar fabric-server.jar nogui > server.log 2>&1 || true
          echo "===== SERVER LOG ====="
          grep -E "Done \(|Loading Minecraft|Loading [0-9]+ mods|ERROR|Exception|Caused by" server.log | head -25

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: destroying-jar
          path: build/libs/*.jar
          if-no-files-found: warn


      - name: Publish to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete server-build --repo ${{ github.repository }} --yes --cleanup-tag || true
          gh release create server-build --repo ${{ github.repository }} --prerelease --title "latest patched server build" build/libs/*.jar

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            servertest/server.log
          if-no-files-found: warn
